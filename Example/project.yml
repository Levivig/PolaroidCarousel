name: PolaroidDemo
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  PolaroidCarousel:
    path: ..
targets:
  PolaroidDemo:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: PolaroidCarousel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PolaroidDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Field Notes
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
schemes:
  PolaroidDemo:
    build:
      targets:
        PolaroidDemo: all
